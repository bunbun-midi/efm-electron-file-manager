<!doctype html><html><head><meta charset="utf-8"><title>EFM Background</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at top left,#1a6b6b,#0c3a3a 55%,#071f1f);color:#aedade;font:16px sans-serif}#clock{position:absolute;right:4vw;bottom:5vh;font-size:clamp(25px,5vw,75px);opacity:.3}button{position:absolute;right:4vw;bottom:2vh;background:transparent;border:0;color:#aedade;opacity:.4;cursor:pointer}
</style></head><body><div id="clock"></div><button onclick="document.getElementById('clock').hidden=!document.getElementById('clock').hidden">Toggle clock</button><script>function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString()}tick();setInterval(tick,1000)</script></body></html>
